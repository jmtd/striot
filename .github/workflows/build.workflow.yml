name: Build and Test

on: [push, pull_request, workflow_dispatch]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  cabal-build:
    name: Cabal build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        ghc: ['9.0']
      fail-fast: false

    steps:
      - uses: actions/checkout@v3

      - uses: haskell/actions/setup@v1
        with:
          ghc-version: ${{ matrix.ghc }}

      - name: Install librdkafka
        run: |
          sudo apt-get update && sudo apt-get install librdkafka-dev

      - name: Install Haskell deps
        run: |
          cabal install happy alex HTF
          cabal install c2hs
          cabal install --lib --only-dependencies --extra-include-dirs=/usr/local/include --extra-lib-dirs=/usr/local/lib

      - name: Build and test striot
        run: |
          cabal configure --enable-tests && cabal build && cabal test

  stack-build:
    name: Stack build (+ examples)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v3

      - uses: haskell/actions/setup@v1
        with:
          ghc-version: '8.6'
          enable-stack: true

      - name: Install librdkafka and graphviz (for dot)
        run: |
          sudo apt-get update && sudo apt-get install librdkafka-dev graphviz

      - name: Install Haskell deps
        run: |
          stack install happy alex HTF
          stack install c2hs
          stack install --only-dependencies

      - name: Build and test striot
        run: |
          stack build --no-haddock-deps --haddock --haddock-arguments "-o haddock"
          stack install
          stack test

      - name: Build examples
        run: |
          ./gen_test_makefile.sh > Makefile; make

      - name: Setup Pages
        uses: actions/configure-pages@v3
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: haddock/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
